name: Build and Deploy Mendix App to Azure

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/fabricado08/mendix-app

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        run: |
          echo "tag=${GITHUB_SHA}" >> $GITHUB_OUTPUT

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ghcr.io/fabricado08/mendix-app:latest
            ghcr.io/fabricado08/mendix-app:${{ github.sha }}

      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Configure Web App Container
        run: |
          az webapp config container set \
            --resource-group Mendix-App_group \
            --name Mendix-App \
            --container-image-name ghcr.io/fabricado08/mendix-app:latest

      - name: Restart Web App
        run: |
          az webapp restart \
            --resource-group Mendix-App_group \
            --name Mendix-App
