name: Deploy to Azure Web App

on:
  workflow_run:
    workflows:
      - Build and Commit MDA
    types:
      - completed
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: azure-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy to Azure Web App
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == 'main'
      )
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Login to Azure Container Registry
        run: |
          az acr login --name YOUR_ACR_NAME

      - name: Build Docker image
        run: |
          docker build -t YOUR_ACR_NAME.azurecr.io/mendix-app:latest .

      - name: Push Docker image
        run: |
          docker push YOUR_ACR_NAME.azurecr.io/mendix-app:latest

      - name: Deploy Web App Container
        uses: azure/webapps-deploy@v3
        with:
          app-name: YOUR_WEBAPP_NAME
          images: YOUR_ACR_NAME.azurecr.io/mendix-app:latest
